<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A3C8F">
<meta name="description" content="Carreras después del liceo en Uruguay, test vocacional y becas.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Orientarte UY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app de una pantalla — barra superior, contenido con scroll y barra inferior al alcance del pulgar. Paleta de la bandera: azul de las franjas y oro del Sol de Mayo. Poco texto, chips para escanear, detalles plegables. */
:root {
  --bg: #F5F7FC;
  --surface: #FFFFFF;
  --line: #E1E6F1;
  --fg: #0E1B3D;
  --muted: #4A5677;
  --faint: #6B7590;
  --brand: #1A3C8F;
  --brand-fg: #FFFFFF;
  --brand-soft: #E6ECF8;
  --sun: #F2B705;
  --sun-ink: #6B4E00;
  --sun-soft: #FFF4CC;
  --ok: #0F6B45;
  --ok-soft: #E3F4EC;
  --heart: #D23C45;
  --track: #EBEEF5;
  --warn: #8A4B00;
  --warn-soft: #FDEBD3;
  --bad: #A3262E;
  --bad-soft: #FBE3E4;
  --font-display: 'Lexend', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Lexend', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1226; --surface: #131C36; --line: #24304F; --fg: #ECF0FA; --muted: #A9B3CC; --faint: #8390B0;
    --brand: #8DAEF5; --brand-fg: #0B1226; --brand-soft: #1D2B52; --sun: #F5C431; --sun-ink: #F5C431; --sun-soft: #2E2814;
    --ok: #6FD6A4; --ok-soft: #12332A; --heart: #F0707A; --track: #1F2A48; --warn: #F5B26B; --warn-soft: #3A2A14; --bad: #F08A90; --bad-soft: #3B1A1E; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1226; --surface: #131C36; --line: #24304F; --fg: #ECF0FA; --muted: #A9B3CC; --faint: #8390B0;
  --brand: #8DAEF5; --brand-fg: #0B1226; --brand-soft: #1D2B52; --sun: #F5C431; --sun-ink: #F5C431; --sun-soft: #2E2814;
  --ok: #6FD6A4; --ok-soft: #12332A; --heart: #F0707A; --track: #1F2A48; --warn: #F5B26B; --warn-soft: #3A2A14; --bad: #F08A90; --bad-soft: #3B1A1E; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
a { color: var(--brand); }
h1, h2, h3 { text-wrap: balance; }

.app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; background: var(--bg); position: relative; }
.topbar { flex-shrink: 0; height: 58px; display: flex; align-items: center; gap: 6px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 18px; }
.back { width: 44px; height: 44px; margin-left: -10px; border: 0; background: transparent; border-radius: 12px; display: grid; place-items: center; color: var(--brand); }
.logo { display: flex; align-items: center; gap: 8px; }
.logo b { font-family: var(--font-display); font-weight: 800; font-size: 21px; letter-spacing: -0.3px; }
.logo span { font-size: 12px; font-weight: 700; background: var(--brand); color: var(--brand-fg); padding: 3px 7px; border-radius: 6px; }

main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.pad { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.muted { color: var(--muted); }
.label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec-title h3 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 20px; }
.sec-title button { border: 0; background: transparent; color: var(--brand); font-weight: 600; font-size: 14px; padding: 10px 0; }

/* Inicio */
.hero { background: #1A3C8F; color: #FFFFFF; padding: 22px 20px 24px; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 14px; }
.stripes { position: absolute; right: 0; bottom: 18px; width: 26%; display: flex; flex-direction: column; gap: 11px; opacity: .14; }
.stripes i { display: block; height: 6px; background: #FFFFFF; }
.hero h1 { position: relative; margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 31px; line-height: 1.06; max-width: 300px; }
.hero p { position: relative; margin: -4px 0 0; font-size: 16px; color: #DCE5FA; max-width: 300px; }
.hero-cta { position: relative; height: 54px; border: 0; border-radius: 16px; background: #F2B705; color: #0E1B3D; font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 10px; }
.hero-search { position: relative; height: 50px; border: 1.5px solid rgba(255,255,255,.35); border-radius: 16px; background: transparent; color: #FFFFFF; display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 15px; text-align: left; }
.profile { border: 0; border-radius: 18px; background: var(--sun-soft); color: var(--fg); padding: 14px 16px; display: flex; align-items: center; gap: 14px; text-align: left; width: 100%; }
.profile .mini-code { display: flex; gap: 4px; }
.profile .mini-code b { width: 34px; height: 34px; border-radius: 50%; background: #1A3C8F; color: #FFFFFF; display: grid; place-items: center; font-family: var(--font-display); font-size: 16px; }
.profile span.t { flex: 1; min-width: 0; }
.profile strong { display: block; font-size: 15px; }
.profile small { color: var(--muted); font-size: 13px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); text-align: left; min-height: 100px; }
.tile .ic { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); }
.tile.alt .ic { background: var(--sun-soft); color: var(--sun-ink); }
.tile strong { font-size: 15px; line-height: 1.2; }
.tile small { color: var(--muted); font-size: 13px; margin-top: -6px; }
.hscroll { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 6px; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }
.ipill { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 14px 6px 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.ipill small { display: block; font-size: 12px; color: var(--muted); }
.ipill strong { display: block; font-size: 14px; text-align: left; }

/* Insignias y tarjetas */
.mini { flex-shrink: 0; min-width: 40px; height: 40px; padding: 0 8px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-size: 12px; }
.pub { background: #1A3C8F; color: #FFFFFF; }
.priv { background: var(--sun-soft); color: var(--sun-ink); }
.card { width: 100%; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; text-align: left; }
.card-head { display: flex; align-items: center; gap: 12px; }
.card-title { flex: 1; min-width: 0; font-weight: 700; font-size: 15px; line-height: 1.25; }
.chev { color: var(--faint); flex-shrink: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: var(--track); color: var(--muted); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.brand { background: var(--brand-soft); color: var(--brand); }
.chip.sun { background: var(--sun-soft); color: var(--sun-ink); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.filter.bach { border-color: var(--brand); color: var(--brand); font-weight: 700; }
.filter.bach[aria-pressed="true"] { background: var(--brand); color: var(--brand-fg); }
.bach-panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; max-height: 60vh; overflow-y: auto; }
.bach-panel .chips { gap: 8px; }
.ori-group { display: flex; flex-direction: column; gap: 6px; }
.ori-group small { font-size: 12px; font-weight: 700; color: var(--faint); }
.bach-panel .chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.bach-panel .filter { width: 100%; height: auto; min-height: 42px; padding: 6px 10px; justify-content: center; text-align: center; line-height: 1.2; }
.bach-actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.bach-actions .btn { min-height: 46px; font-size: 15px; }
.bach-actions .btn[disabled] { opacity: .45; cursor: not-allowed; }
.elig { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 16px; font-weight: 700; font-size: 15px; border: 0; width: 100%; text-align: left; }
.elig small { display: block; font-weight: 500; font-size: 13px; margin-top: 2px; }
.elig.ok { background: var(--ok-soft); color: var(--ok); }
.elig.check { background: var(--warn-soft); color: var(--warn); }
.elig.no { background: var(--bad-soft); color: var(--bad); }
.elig.na { background: var(--track); color: var(--muted); }
.elig.ask { background: var(--brand-soft); color: var(--brand); }

/* Buscar */
.searchbar { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 12px 16px 6px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
.search-wrap { position: relative; }
.search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.search { height: 50px; border: 1.5px solid var(--line); border-radius: 14px; padding: 0 14px 0 44px; font: inherit; font-size: 16px; color: var(--fg); background: var(--surface); width: 100%; }
.search:focus { border-color: var(--brand); outline: none; }
.filter { flex: 0 0 auto; height: 38px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 600; border: 1.5px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; gap: 6px; }
.filter[aria-pressed="true"] { background: var(--brand); color: var(--brand-fg); border-color: var(--brand); }
.filter.clear { border-style: dashed; color: var(--muted); }
.count { font-size: 13px; font-weight: 600; color: var(--muted); }
.empty { text-align: center; padding: 36px 16px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty strong { color: var(--fg); font-size: 17px; }

/* Institución */
.inst-head { padding: 18px 16px; display: flex; gap: 14px; align-items: center; background: var(--surface); border-bottom: 1px solid var(--line); }
.inst-head .mini { height: 56px; min-width: 56px; font-size: 14px; border-radius: 16px; }
.inst-head h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 20px; line-height: 1.15; }

/* Carrera */
.c-head { padding: 18px 16px 16px; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.c-head h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1.1; }
.linkbtn { border: 0; background: transparent; padding: 0; color: var(--brand); font-weight: 600; text-align: left; display: inline-flex; align-items: center; gap: 8px; min-height: 32px; }
.facts3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.fact3 { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fact3 svg { color: var(--brand); }
.fact3 small { font-size: 12px; color: var(--muted); font-weight: 600; }
.fact3 strong { font-size: 13px; line-height: 1.3; overflow-wrap: break-word; hyphens: manual; }
.fact3 strong.na { color: var(--faint); font-weight: 600; font-size: 13px; }
details.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
details.sec summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 14px; min-height: 52px; font-weight: 700; cursor: pointer; }
details.sec summary::-webkit-details-marker { display: none; }
details.sec summary svg:first-child { color: var(--brand); flex-shrink: 0; }
details.sec summary span { flex: 1; }
details.sec summary .down { color: var(--faint); transition: transform .15s; }
details.sec[open] summary .down { transform: rotate(180deg); }
.sec-body { padding: 0 14px 14px 46px; line-height: 1.5; color: var(--fg); }
.sec-body p { margin: 0; }
.jobs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.jobs li { display: flex; gap: 10px; align-items: baseline; }
.jobs li::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--sun); flex-shrink: 0; transform: translateY(-2px); }
.actionbar { position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 10px 16px; display: grid; grid-template-columns: 1fr auto auto; gap: 10px; }
.btn { min-height: 52px; border-radius: 14px; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px solid var(--brand); background: var(--brand); color: var(--brand-fg); width: 100%; padding: 0 16px; text-decoration: none; }
.btn.ghost { background: transparent; color: var(--brand); }
.btn.fav-on { background: transparent; color: var(--heart); border-color: var(--heart); }
.btn.icon { width: 52px; padding: 0; }
.src { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.5; margin: 0; }
.credit { margin: 6px 0 0; padding-top: 16px; border-top: 1px solid var(--line); text-align: center; font-size: 12px; color: var(--faint); letter-spacing: .02em; }
.credit strong { font-weight: 700; color: var(--muted); }

/* Test */
.types { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.type { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; text-align: center; }
.type b { width: 34px; height: 34px; border-radius: 50%; background: var(--brand); color: var(--brand-fg); display: grid; place-items: center; font-family: var(--font-display); font-size: 16px; }
.big { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1.1; }
.lede { font-size: 16px; line-height: 1.45; color: var(--muted); margin: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.qwrap { min-height: 100%; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 16px; }
.qtop { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.qtop button { border: 0; background: transparent; color: var(--brand); font-weight: 600; font-size: 14px; min-height: 44px; padding: 0 4px; }
.pbar { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
.pbar span { display: block; height: 100%; background: var(--sun); border-radius: 4px; transition: width .2s; }
.qmeta { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); min-height: 18px; }
.qmeta em { font-style: normal; color: var(--sun-ink); }
.qcard { flex: 1; min-height: 220px; display: flex; align-items: center; justify-content: center; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 28px 22px; font-family: var(--font-display); font-size: 25px; font-weight: 700; line-height: 1.25; text-wrap: balance; }
.yesno { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.yesno button { height: 66px; border-radius: 18px; font-size: 18px; font-weight: 800; }
.yesno .no { background: var(--surface); border: 1.5px solid var(--line); color: var(--fg); }
.yesno .yes { background: var(--brand); border: 1.5px solid var(--brand); color: var(--brand-fg); }
.yesno button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--sun); }
.result { background: #1A3C8F; color: #FFFFFF; border-radius: 22px; padding: 20px 18px; display: flex; flex-direction: column; gap: 14px; text-align: center; }
.result small { color: #F2B705; font-weight: 700; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
.code3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.code3 div { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #DCE5FA; }
.code3 b { width: 66px; height: 66px; border-radius: 50%; background: #FFFFFF; color: #1A3C8F; display: grid; place-items: center; font-family: var(--font-display); font-size: 32px; }
.code3 div:first-child b { background: #F2B705; color: #0E1B3D; }
.result p { margin: 0; font-size: 15px; line-height: 1.45; }
.result .share { height: 46px; border-radius: 14px; border: 1.5px solid rgba(255,255,255,.45); background: transparent; color: #FFFFFF; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
.bars { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.bar { display: grid; grid-template-columns: 112px minmax(0, 1fr) 26px; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; }
.bar .tr { height: 12px; border-radius: 6px; background: var(--track); overflow: hidden; }
.bar .fill { display: block; height: 100%; border-radius: 6px; background: var(--faint); }
.bar .fill.top { background: var(--brand); }
.bar span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.sharebox { width: 100%; min-height: 90px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); padding: 10px; font: inherit; font-size: 14px; }

/* Favoritos y comparar */
.favrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: stretch; }
.cmp-toggle { width: 66px; border-radius: 16px; border: 1.5px solid var(--line); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--muted); }
.cmp-toggle[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
.cmp-scroll { overflow-x: auto; margin: 0 -16px; padding: 0 16px 6px; }
.cmp { border-collapse: separate; border-spacing: 0; min-width: 100%; font-size: 14px; }
.cmp th, .cmp td { text-align: left; vertical-align: top; padding: 10px; border-bottom: 1px solid var(--line); min-width: 150px; line-height: 1.4; }
.cmp th[scope="row"] { min-width: 96px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); position: sticky; left: 0; background: var(--bg); }
.cmp thead th { font-family: var(--font-display); font-size: 16px; }

nav.tabs { flex-shrink: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs button { position: relative; height: 64px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--faint); }
nav.tabs button[aria-current="page"] { color: var(--brand); }
nav.tabs button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--brand); }
nav.tabs .badge { position: absolute; top: 8px; left: 56%; min-width: 18px; height: 18px; border-radius: 9px; background: var(--heart); color: #FFFFFF; font-size: 11px; display: grid; place-items: center; padding: 0 4px; }
.toast { position: absolute; left: 16px; right: 16px; top: 66px; background: var(--fg); color: var(--bg); padding: 12px 16px; border-radius: 14px; font-weight: 600; font-size: 14px; text-align: center; z-index: 5; }
main > * { zoom: var(--z, 1); }
@media (prefers-reduced-motion: no-preference) {
  main.anim > * { animation: in .26s cubic-bezier(.2,.8,.2,1); }
  main.anim .qcard { animation: qin .28s cubic-bezier(.2,.8,.2,1); }
  @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes qin { from { opacity: 0; transform: translateX(24px) scale(.98); } to { opacity: 1; transform: none; } }
  button, .btn { transition: transform .12s ease, background-color .15s ease, border-color .15s ease, color .15s ease; }
  button:active, .btn:active { transform: scale(.96); }
  details[open] > .sec-body, details[open] > .plan-body { animation: in .2s ease-out; }
  .btn.fav-on svg { animation: pop .35s cubic-bezier(.3,1.6,.5,1); }

    if (t.hasAttribute('data-gratis')) { S.gratis = !S.gratis; render(true); return; }
    if (t.hasAttribute('data-clear')) { S.area = 'Todas'; S.zona = 'Todo el país'; S.gratis = false; S.q = ''; S.canOnly = false; S.int = null; render(true); return; }
    if (t.hasAttribute('data-int')) { var ik = t.getAttribute('data-int'); S.int = S.int === ik ? null : ik; buzz(8); render(true); return; }
    if (t.hasAttribute('data-bach-open')) { S.bachOpen = !S.bachOpen; S.draft = S.bach ? { lvl: S.bach.lvl, o: S.bach.o } : {}; render(true); return; }
    if (t.hasAttribute('data-bach-go')) { S.bachOpen = true; S.draft = {}; push({ view: 'search' }); return; }
    if (t.hasAttribute('data-lvl')) { S.draft = S.draft || {}; S.draft.lvl = t.getAttribute('data-lvl'); if (S.draft.lvl !== '6') S.draft.o = null; render(true); return; }
    if (t.hasAttribute('data-ori')) { S.draft = S.draft || {}; S.draft.o = t.getAttribute('data-ori'); render(true); return; }
    if (t.hasAttribute('data-bach-done')) { if (t.disabled) return; S.bach = { lvl: S.draft.lvl, o: S.draft.lvl === '6' ? S.draft.o : null }; S.bachOpen = false; saveBach(); toast('Listo: marcamos a qué carreras podés entrar'); render(true); return; }
    if (t.hasAttribute('data-bach-clear')) { S.bach = null; S.bachOpen = false; S.canOnly = false; saveBach(); render(true); return; }
    if (t.hasAttribute('data-bach-cancel')) { S.bachOpen = false; render(true); return; }
    if (t.hasAttribute('data-canonly')) { S.canOnly = !S.canOnly; render(true); return; }
    if (t.hasAttribute('data-plan')) {
      var pid = t.getAttribute('data-plan'), ps = +t.getAttribute('data-step'), arr = (plan[pid] || []).slice();
      arr[ps] = !arr[ps]; plan[pid] = arr; savePlan(); S.planOpen = pid; buzz(10);
      if (planDone(pid) === PLAN_STEPS.length) toast('¡Completaste tu plan para esta carrera!');
      render(true); return;
    }
    if (t.hasAttribute('data-pref')) {
      var pkey = t.getAttribute('data-pref'), pv = t.getAttribute('data-val');
      PREF[pkey] = pkey === 'vib' ? pv === 'true' : pv; savePrefs(); applyPrefs(); buzz(10); render(true); return;
    }
    if (t.hasAttribute('data-ab')) {
      var aid = t.getAttribute('data-ab'), av = t.getAttribute('data-v');
      if (AB.a === aid) AB.a = null; AB.b = AB.b.filter(function (x) { return x !== aid; });
      if (av === 'a') { AB.a = aid; toast('Es tu Plan A'); } else if (av === 'b') { AB.b.push(aid); toast('Agregada a tus Planes B'); }
      saveAB(); buzz(10); render(true); return;
    }
    if (t.hasAttribute('data-resumen-share')) { shareTextOut(resumenText(), 'Mi resumen de Orientarte UY'); return; }
    if (t.hasAttribute('data-resumen-copy')) {
      var rt = resumenText(), rbox = document.getElementById('sharebox');
      var rfb = function () { if (rbox) { rbox.value = rt; rbox.hidden = false; rbox.focus(); rbox.select(); } toast('Copiá el texto de la caja'); };
      try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(rt).then(function () { toast('Resumen copiado'); }, rfb); else rfb(); } catch (err) { rfb(); }
      return;
    }
    if (t.hasAttribute('data-share-career')) { shareCareer(t.getAttribute('data-share-career')); return; }
    if (t.hasAttribute('data-settings')) { push({ view: 'ajustes' }); return; }
    if (t.hasAttribute('data-cmp')) {
      var cid = t.getAttribute('data-cmp'), ci = S.cmp.indexOf(cid);
      if (ci >= 0) S.cmp.splice(ci, 1); else if (S.cmp.length < 3) S.cmp.push(cid); else toast('Podés comparar hasta 3 carreras');
      render(true); return;
    }
    if (t.hasAttribute('data-compare')) { push({ view: 'compare' }); return; }
    if (t.hasAttribute('data-share')) {
      var text = shareText(), box = document.getElementById('sharebox');
      var fallback = function () { if (box) { box.value = text; box.hidden = false; box.focus(); box.select(); } toast('Copiá el texto y pegalo donde quieras'); };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast('Copiado: pegalo en WhatsApp o donde quieras'); }, fallback);
        else fallback();
      } catch (err) { fallback(); }
      return;
    }
    if (t.hasAttribute('data-answer')) {
      S.answers[S.step] = +t.getAttribute('data-answer'); buzz(8);
      if (S.step >= ITEMS.length - 1) S.phase = 'done'; else S.step++;
      saveTest(); render(); return;
    }
    var a = t.getAttribute('data-test');
    if (a === 'start') { S.phase = 'q'; S.step = 0; S.answers = []; }
    else if (a === 'resume') { S.phase = 'q'; var first = 0; while (first < ITEMS.length - 1 && (S.answers[first] === 0 || S.answers[first] === 1)) first++; S.step = first; }
    else if (a === 'prev') { S.step = Math.max(0, S.step - 1); }
    else if (a === 'pause') { S.phase = 'intro'; toast('Guardamos tu avance'); }
    else if (a === 'reset') { S.phase = 'intro'; S.step = 0; S.answers = []; }
    else return;
    saveTest(); render();
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'buscador') { S.q = e.target.value; renderResults(); }
  });

  applyPrefs();
  render();
})();
</script>
<script>if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }</script>
</body>
